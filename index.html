<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tale of Under</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050509;color:#fff;font-family:Arial,sans-serif}#g{position:relative;width:min(100vw,900px);height:min(100vh,1600px);aspect-ratio:9/16;margin:auto;overflow:hidden;background:#090912}canvas{position:absolute;inset:0;width:100%;height:100%}button{color:#fff;background:#11111a;border:2px solid #aaa;border-radius:10px;padding:12px;font-weight:800}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050509ee;z-index:10}.hidden{display:none!important}.logo{text-align:center;font-size:12vw;line-height:.85;font-weight:900;text-shadow:0 0 15px #8b6cff}.sub{text-align:center;color:#aaa;margin:25px}.menu{display:grid;gap:12px;width:75%}#hud{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;justify-content:space-between;font-weight:900}.pill{background:#08080dcc;border:1px solid #666;padding:7px;border-radius:8px}#dialogue{position:absolute;left:5%;right:5%;bottom:18%;z-index:8;background:#08080df5;border:3px solid white;border-radius:10px;padding:16px;font-size:18px;line-height:1.4}#dialogue b{display:block;color:#d5c5ff;margin-bottom:5px}#hint{position:absolute;bottom:5%;width:100%;text-align:center;color:#888;z-index:8}#controls{position:absolute;bottom:4%;left:5%;right:5%;z-index:7;display:flex;justify-content:space-between;align-items:end}.dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:3px}.dpad button{padding:0}.up{grid-column:2}.left{grid-row:2}.down{grid-column:2;grid-row:3}.right{grid-column:3;grid-row:2}.acts{display:flex;gap:7px}.acts button{width:64px;height:64px;border-radius:50%}#battle{position:absolute;inset:0;z-index:9}.box{position:absolute;left:8%;right:8%;top:27%;height:35%;border:3px solid #fff;background:#050509;overflow:hidden}.soul{position:absolute;width:18px;height:18px;background:#ff365c;transform:rotate(45deg);left:50%;top:50%;box-shadow:0 0 12px #ff365c}.bullet{position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 0 8px white}.bt{position:absolute;left:7%;right:7%;bottom:22%;font-weight:800}.bb{position:absolute;bottom:5%;left:5%;right:5%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.bb button{border-color:#e5a52c;background:#171208;padding:9px 2px;font-size:12px}#toast{position:absolute;top:12%;left:10%;right:10%;z-index:30;text-align:center;background:white;color:#111;padding:9px;border-radius:9px;font-weight:900;opacity:0;transition:.2s}.show{opacity:1!important}</style></head><body><div id="g"><canvas id="c"></canvas><div id="hud" class="hidden"><div class="pill">HP <span id="hp">20/20</span></div><div class="pill">LV <span id="lv">1</span> · <span id="gold">0</span>G</div></div><div id="title" class="screen"><div class="logo">TALE OF<br>UNDER</div><div class="sub">A tiny underground adventure.<br>Explore. Talk. Fight. Choose.</div><div class="menu"><button id="new">NEW GAME</button><button id="cont">CONTINUE</button></div></div><div id="dialogue" class="hidden"><b id="who">???</b><span id="txt"></span></div><div id="hint" class="hidden">Tap to continue</div><div id="controls" class="hidden"><div class="dpad"><button class="up" data-d="u">▲</button><button class="left" data-d="l">◀</button><button class="down" data-d="d">▼</button><button class="right" data-d="r">▶</button></div><div class="acts"><button id="talk">A<br><small>TALK</small></button><button id="save">☰</button></div></div><div id="battle" class="hidden"><div class="box" id="box"><div class="soul" id="soul"></div></div><div class="bt" id="bt">A GLOOMY GREMLIN blocks your path.</div><div class="bb"><button data-a="fight">FIGHT</button><button data-a="act">ACT</button><button data-a="item">ITEM</button><button data-a="spare">SPARE</button></div></div><div id="toast"></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),G=document.getElementById('g');let W,H;function size(){let r=G.getBoundingClientRect();W=r.width;H=r.height;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}size();addEventListener('resize',size);let S={mode:'title',room:'cave',x:.5,y:.62,hp:20,max:20,lv:1,gold:0,items:2,met:false,enemyHp:28,turn:0};let K={},Q=[],open=false,after=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem('tou',JSON.stringify(S));toast('Saved!')}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)}function sync(){$('hp').textContent=S.hp+'/'+S.max;$('lv').textContent=S.lv;$('gold').textContent=S.gold}function mode(m){S.mode=m;$('title').classList.toggle('hidden',m!=='title');$('hud').classList.toggle('hidden',m==='title');$('controls').classList.toggle('hidden',m!=='world');$('battle').classList.toggle('hidden',m!=='battle')}function say(a,fn){Q=a.slice();after=fn||null;open=true;$('dialogue').classList.remove('hidden');$('hint').classList.remove('hidden');next()}function next(){if(Q.length){let q=Q.shift();$('who').textContent=q[0];$('txt').textContent=q[1]}else{open=false;$('dialogue').classList.add('hidden');$('hint').classList.add('hidden');let f=after;after=null;if(f)f()}}$('dialogue').onclick=next;$('hint').onclick=next;addEventListener('keydown',e=>{K[e.key.toLowerCase()]=true;if(e.key===' '&&open)next()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=false);document.querySelectorAll('[data-d]').forEach(b=>{b.onpointerdown=()=>K[b.dataset.d]=1;b.onpointerup=()=>K[b.dataset.d]=0;b.onpointercancel=()=>K[b.dataset.d]=0});function start(){S={...S,mode:'world',room:'cave',x:.5,y:.62,hp:20,max:20,lv:1,gold:0,items:2,met:false,enemyHp:28,turn:0};mode('world');sync();say([['???','You wake up somewhere that is definitely not home.'],['???','The walls hum quietly. Something is watching.'],['SYSTEM','Use WASD/arrows or the touch pad. Talk near characters.']])}$('new').onclick=start;$('cont').onclick=()=>{try{Object.assign(S,JSON.parse(localStorage.tou));mode(S.mode==='battle'?'battle':'world');sync();toast('Save loaded!')}catch{toast('No save yet.')}};$('save').onclick=save;$('talk').onclick=interact;function interact(){if(S.mode!=='world'||open)return;if(S.room==='cave'&&Math.hypot(S.x-.5,S.y-.34)<.13&&!S.met){S.met=true;say([['MILO','Hey. You fell pretty far.'],['MILO','I could show you the way out...'],['MILO','...but something hungry is coming.']],battle);return}if(S.room==='hall'&&Math.hypot(S.x-.72,S.y-.5)<.15){say([['OLD SIGN','WELCOME TO THE UNDER.'],['OLD SIGN','EXIT: ???'],['YOU','That is extremely helpful.']]);return}toast('Nothing interesting nearby.')}function battle(){S.mode='battle';S.enemyHp=28;S.turn=0;mode('battle');$('bt').textContent='A GLOOMY GREMLIN blocks your path.'}function end(win){S.mode='world';mode('world');if(win){S.gold+=12;S.lv=2;say([['MILO','Not bad. You earned that.']],save)}else{S.hp=S.max;toast('You wake at the checkpoint.')}sync()}function action(a){if(S.mode!=='battle'||open)return;if(a==='fight'){let d=7+Math.floor(Math.random()*6);S.enemyHp-=d;$('bt').textContent='You strike for '+d+' damage!';S.turn++;if(S.enemyHp<=0){setTimeout(()=>end(true),500);return}}else if(a==='act'){S.turn++;say([['YOU','You compliment the gremlin.'],['GREMLIN','...Nobody does that.'],['GREMLIN','I am confused.']],()=>$('bt').textContent='The gremlin looks less angry.')}else if(a==='item'){if(S.items){S.items--;S.hp=Math.min(S.max,S.hp+8);$('bt').textContent='Mystery snack! +8 HP';S.turn++}else $('bt').textContent='Your pockets are empty.'}else if(a==='spare'){if(S.enemyHp<=18){end(true);return}S.turn++;$('bt').textContent='It refuses to leave. Try ACT first.'}sync()}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a));function update(){if(S.mode==='world'&&!open){let p=.004;if(K.w||K.u)S.y-=p;if(K.s||K.d)S.y+=p;if(K.a||K.l)S.x-=p;if(K.d||K.r)S.x+=p;S.x=Math.max(.08,Math.min(.92,S.x));S.y=Math.max(.13,Math.min(.88,S.y));if(S.y<.13){S.room='hall';S.y=.85;toast('You entered the old hall.')}if(S.y>.88&&S.room==='hall'){S.room='cave';S.y=.16}}if(S.mode==='battle'&&!open){let q=$('soul'),px=parseFloat(q.style.left||50),py=parseFloat(q.style.top||50),p=1.2;if(K.w||K.u)py-=p;if(K.s||K.d)py+=p;if(K.a||K.l)px-=p;if(K.d||K.r)px+=p;q.style.left=Math.max(3,Math.min(97,px))+'%';q.style.top=Math.max(4,Math.min(96,py))+'%';if(S.turn&&Math.random()<.03){let b=document.createElement('i');b.className='bullet';b.style.left=Math.random()*90+5+'%';b.style.top='-10px';$('box').appendChild(b)}}document.querySelectorAll('.bullet').forEach(b=>{let t=parseFloat(b.style.top)+2.2;b.style.top=t+'px';if(t>105)b.remove()});draw();requestAnimationFrame(update)}function draw(){x.clearRect(0,0,W,H);if(S.mode==='title')return;if(S.mode==='battle'){x.fillStyle='#050509';x.fillRect(0,0,W,H);x.fillStyle='#eee';x.font='bold 22px Arial';x.textAlign='center';x.fillText('GLOOMY GREMLIN',W/2,H*.13);x.font='14px Arial';x.fillStyle='#aaa';x.fillText('HP '+Math.max(0,S.enemyHp)+'/28',W/2,H*.17);x.fillStyle='#7b63a8';x.beginPath();x.arc(W/2,H*.22,36,0,7);x.fill();return}let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17102b');g.addColorStop(1,'#07080c');x.fillStyle=g;x.fillRect(0,0,W,H);for(let yy=0;yy<H;yy+=36)for(let xx=0;xx<W;xx+=36){x.strokeStyle=((xx/36+yy/36)%2?'#1b1728':'#211c31');x.strokeRect(xx,yy,36,36)}x.fillStyle='#2d2940';x.fillRect(0,H*.13,W,5);x.fillRect(0,H*.87,W,5);for(let i=0;i<9;i++){let xx=(i*83+40)%W,yy=H*.28+(i%3)*80;x.fillStyle=i%2?'#7754a8':'#4c7ba8';x.beginPath();x.moveTo(xx,yy-25);x.lineTo(xx+14,yy);x.lineTo(xx,yy+25);x.lineTo(xx-12,yy);x.fill()}if(S.room==='hall'){x.fillStyle='#6d4c32';x.fillRect(W*.68,H*.43,8,75);x.fillStyle='#b48a55';x.fillRect(W*.59,H*.38,W*.26,60);x.fillStyle='#24180e';x.font='bold 12px Arial';x.fillText('EXIT ?',W*.65,H*.43)}let px=S.x*W,py=S.y*H;x.fillStyle='#f0f0ff';x.beginPath();x.arc(px,py-12,10,0,7);x.fill();x.fillStyle='#9d7bff';x.fillRect(px-9,py-2,18,25);if(S.room==='cave'){x.fillStyle='#b8e07a';x.beginPath();x.arc(W*.5,H*.34,20,0,7);x.fill();x.fillStyle='#111';x.fillRect(W*.5-12,H*.33,7,4);x.fillRect(W*.5+5,H*.33,7,4);x.fillStyle='#fff';x.font='bold 12px Arial';x.fillText('MILO',W*.5-16,H*.34+35)}}update();</script></body></html>
