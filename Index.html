<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Starfall — Phone Game</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; font-family: monospace;
    touch-action: none;
  }
  body { display:flex; align-items:center; justify-content:center; }
  #game {
    position:relative; width:100vw; height:100vh; max-width:900px;
    background:#050509; overflow:hidden;
  }
  canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  #hud {
    position:absolute; top:10px; left:12px; right:12px;
    display:flex; justify-content:space-between; pointer-events:none;
    font-size:15px; text-shadow:2px 2px #000;
  }
  #dialogue {
    position:absolute; left:7%; right:7%; bottom:20%;
    min-height:110px; padding:16px; border:3px solid #fff;
    background:#050509; box-shadow:6px 6px #000;
    font-size:17px; line-height:1.45; display:none;
  }
  #dialogue .name { color:#ffe75b; margin-bottom:8px; }
  #dialogue .hint { color:#aaa; font-size:12px; margin-top:10px; }
  #title {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#000;
    z-index:5; text-align:center;
  }
  #title h1 { font-size:42px; letter-spacing:5px; margin:0 0 8px; }
  #title p { color:#aaa; margin:0 0 28px; }
  button {
    font:inherit; color:#fff; background:#111; border:2px solid #fff;
    padding:12px 20px; cursor:pointer;
  }
  button:active { background:#fff; color:#000; }
  #controls {
    position:absolute; bottom:15px; left:15px; right:15px;
    display:flex; justify-content:space-between; align-items:end;
    pointer-events:none;
  }
  .pad { width:150px; height:150px; position:relative; pointer-events:auto; }
  .pad button {
    position:absolute; width:50px; height:50px; padding:0; opacity:.72;
    background:#101018; border-color:#888; border-radius:8px;
  }
  #up{left:50px;top:0} #left{left:0;top:50px}
  #down{left:50px;top:100px} #right{left:100px;top:50px}
  #act {
    pointer-events:auto; width:80px; height:80px; border-radius:50%;
    opacity:.8;
  }
  @media (min-width:700px) {
    #game { border:3px solid #333; }
    #controls { bottom:25px; }
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="title">
    <h1>STARFALL</h1>
    <p>A tiny phone adventure</p>
    <button id="start">START GAME</button>
  </div>

  <div id="hud">
    <span id="hp">HP 20/20</span>
    <span id="area">STARFALL</span>
  </div>

  <div id="dialogue">
    <div class="name" id="dname">???</div>
    <div id="dtext"></div>
    <div class="hint">TAP ACTION / ENTER</div>
  </div>

  <div id="controls">
    <div class="pad">
      <button id="up">▲</button>
      <button id="left">◀</button>
      <button id="down">▼</button>
      <button id="right">▶</button>
    </div>
    <button id="act">A</button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W=0,H=0,scale=1;

function resize(){
  W=canvas.width=window.innerWidth*devicePixelRatio;
  H=canvas.height=window.innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  scale=devicePixelRatio;
}
window.addEventListener("resize",resize); resize();

const player={x:.5,y:.58,r:12,speed:.0028};
const stars=[];
for(let i=0;i<90;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.3,a:Math.random()});

let keys={up:false,down:false,left:false,right:false};
let running=false, dialogue=false, line=0;

const lines=[
  ["???","...You finally woke up."],
  ["???","Don't be scared. This place is called Starfall."],
  ["???","Something fell from the sky tonight."],
  ["???","If you want answers, follow the lights."],
  ["???","Good luck, little star."]
];

function setKey(k,v){keys[k]=v}
function bind(id,k){
  const b=document.getElementById(id);
  ["touchstart","mousedown"].forEach(e=>b.addEventListener(e,ev=>{ev.preventDefault();setKey(k,true)}));
  ["touchend","touchcancel","mouseup","mouseleave"].forEach(e=>b.addEventListener(e,ev=>{ev.preventDefault();setKey(k,false)}));
}
bind("up","up");bind("down","down");bind("left","left");bind("right","right");

document.getElementById("start").onclick=()=>{
  document.getElementById("title").style.display="none";
  running=true;
  openDialogue();
};

document.getElementById("act").onclick=advanceDialogue;
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
  if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
  if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
  if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
  if(e.key==="Enter"||e.key===" ")advanceDialogue();
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
  if(e.key==="ArrowDown"||e.key==="s")keys.down=false;
  if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
  if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

function openDialogue(){
  dialogue=true; line=Math.min(line,lines.length-1);
  document.getElementById("dialogue").style.display="block";
  document.getElementById("dname").textContent=lines[line][0];
  document.getElementById("dtext").textContent=lines[line][1];
}
function advanceDialogue(){
  if(!running)return;
  if(!dialogue){openDialogue();return;}
  line++;
  if(line>=lines.length){
    dialogue=false;
    document.getElementById("dialogue").style.display="none";
  } else openDialogue();
}

function draw(){
  const w=innerWidth,h=innerHeight;
  ctx.clearRect(0,0,w,h);

  // night sky
  ctx.fillStyle="#050509";ctx.fillRect(0,0,w,h);
  for(const s of stars){
    const tw=.5+.5*Math.sin(Date.now()*.002+s.a*8);
    ctx.globalAlpha=.35+.65*tw;
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // ground
  ctx.fillStyle="#0b1014";
  ctx.fillRect(0,h*.38,w,h*.62);
  ctx.strokeStyle="#172027";
  ctx.lineWidth=2;
  for(let y=h*.4;y<h;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  for(let x=0;x<w;x+=55){ctx.beginPath();ctx.moveTo(x,h*.38);ctx.lineTo(x,h);ctx.stroke();}

  // glowing star
  const sx=w*.72, sy=h*.30;
  const g=ctx.createRadialGradient(sx,sy,2,sx,sy,55);
  g.addColorStop(0,"rgba(255,245,150,.9)");
  g.addColorStop(1,"rgba(255,245,150,0)");
  ctx.fillStyle=g;ctx.fillRect(sx-60,sy-60,120,120);
  ctx.fillStyle="#fff5a0";ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);ctx.fill();

  // player
  const px=player.x*w, py=player.y*h;
  ctx.fillStyle="#fff";
  ctx.fillRect(px-10,py-10,20,20);
  ctx.fillStyle="#111";
  ctx.fillRect(px-5,py-5,3,3);ctx.fillRect(px+3,py-5,3,3);
  ctx.fillRect(px-4,py+5,8,2);

  if(running && !dialogue){
    if(keys.up)player.y-=player.speed*16;
    if(keys.down)player.y+=player.speed*16;
    if(keys.left)player.x-=player.speed*16;
    if(keys.right)player.x+=player.speed*16;
    player.x=Math.max(.04,Math.min(.96,player.x));
    player.y=Math.max(.39,Math.min(.96,player.y));
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
